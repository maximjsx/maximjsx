name: Abduction Intake

on:
  issues:
    types: [opened]
  issue_comment:
    types: [created]

jobs:

  # ─────────────────────────────────────────────
  # JOB 1 — New issue opened
  # ─────────────────────────────────────────────
  board-abductee:
    if: github.event_name == 'issues' && startsWith(github.event.issue.title, 'Abduction')
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: write

    steps:
    - name: Checkout
      uses: actions/checkout@v3

    - name: Validate title
      run: |
        if [ "${{ github.event.issue.title }}" = "Abduction" ]; then
          echo "VALID=true" >> $GITHUB_ENV
        else
          echo "VALID=false" >> $GITHUB_ENV
        fi

    - name: Reject tampered title
      if: env.VALID == 'false'
      run: |
        curl -s -X POST \
          -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
          -H "Accept: application/vnd.github+json" \
          -d '{"body":"## ⚠️ Application Rejected\n\nIssue title was modified. Please close this and resubmit with the exact title `Abduction`."}' \
          "https://api.github.com/repos/${{ github.repository }}/issues/${{ github.event.issue.number }}/comments"
        curl -s -X PATCH \
          -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
          -H "Accept: application/vnd.github+json" \
          "https://api.github.com/repos/${{ github.repository }}/issues/${{ github.event.issue.number }}" \
          -d '{"state":"closed","state_reason":"not_planned"}'

    - name: Post — receiving application
      if: env.VALID == 'true'
      run: |
        curl -s -X POST \
          -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
          -H "Accept: application/vnd.github+json" \
          -d '{"body":"![](https://readme-typing-svg.demolab.com?font=Jersey+10&size=30&duration=3000&pause=99999&color=33793d&vCenter=true&repeat=false&width=500&height=40&lines=Receiving+application...)"}' \
          "https://api.github.com/repos/${{ github.repository }}/issues/${{ github.event.issue.number }}/comments"

    - name: Post — connecting
      if: env.VALID == 'true'
      run: |
        sleep 4
        curl -s -X POST \
          -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
          -H "Accept: application/vnd.github+json" \
          -d "{\"body\":\"![](https://readme-typing-svg.demolab.com?font=Jersey+10&size=30&duration=3000&pause=99999&color=33793d&vCenter=true&repeat=false&width=500&height=40&lines=Connecting+to+AZ-51...)\n\n\`\`\`\nAZ-51 SECURE TERMINAL — DREAMLAND NETWORK\nEstablishing encrypted connection ...\nHandshake with DREAMLAND-AZ-51 ... OK\nAuthenticating session ... OK\n\`\`\`\"}" \
          "https://api.github.com/repos/${{ github.repository }}/issues/${{ github.event.issue.number }}/comments"

    - name: Post — identity lookup
      if: env.VALID == 'true'
      run: |
        sleep 4
        curl -s -X POST \
          -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
          -H "Accept: application/vnd.github+json" \
          -d "{\"body\":\"![](https://readme-typing-svg.demolab.com?font=Jersey+10&size=30&duration=3000&pause=99999&color=33793d&vCenter=true&repeat=false&width=500&height=40&lines=Retrieving+identity+record...)\n\n\`\`\`\nAZ-51 SECURE TERMINAL — DREAMLAND NETWORK\nEstablishing encrypted connection ... OK\nQuerying abductee log ...\nRetrieving identity record for: ${{ github.actor }} ...\nCross-referencing with Dreamland flight logs LOWW → KXTA ...\n\`\`\`\"}" \
          "https://api.github.com/repos/${{ github.repository }}/issues/${{ github.event.issue.number }}/comments"

    - name: Check duplicate
      if: env.VALID == 'true'
      run: |
        if grep -q "\[${{ github.actor }}\]" README.md; then
          echo "DUPLICATE=true" >> $GITHUB_ENV
        else
          echo "DUPLICATE=false" >> $GITHUB_ENV
        fi

    # ── DUPLICATE PATH ──────────────────────────────────────────────────────

    - name: Post — duplicate found
      if: env.VALID == 'true' && env.DUPLICATE == 'true'
      run: |
        sleep 4
        curl -s -X POST \
          -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
          -H "Accept: application/vnd.github+json" \
          -d "{\"body\":\"![](https://readme-typing-svg.demolab.com?font=Jersey+10&size=30&duration=3000&pause=99999&color=e0a000&vCenter=true&repeat=false&width=500&height=40&lines=Abductee+already+on+log.)\n\n\`\`\`\nAZ-51 SECURE TERMINAL — DREAMLAND NETWORK\nIdentity confirmed: ${{ github.actor }}\nChecking prior bookings ... EXISTING RECORD FOUND\nDuplicate application rejected.\n\`\`\`\n\n---\n\n> ✅ You are already on the log. No need to reapply.\n\n---\n\n### Not a VIP yet?\n\nIf you have an **exclusive access code**, drop it as a comment below.\nYou will be upgraded to **⭐ Probe Class** status with access to the Hangar 18.\n\n> _This issue closes automatically in 2 minutes._\"}" \
          "https://api.github.com/repos/${{ github.repository }}/issues/${{ github.event.issue.number }}/comments"

    - name: Wait for code — duplicate
      if: env.VALID == 'true' && env.DUPLICATE == 'true'
      run: sleep 120

    - name: Close duplicate issue
      if: env.VALID == 'true' && env.DUPLICATE == 'true'
      run: |
        curl -s -X PATCH \
          -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
          -H "Accept: application/vnd.github+json" \
          "https://api.github.com/repos/${{ github.repository }}/issues/${{ github.event.issue.number }}" \
          -d '{"state":"closed","state_reason":"completed"}'

    # ── FRESH ABDUCTEE PATH ────────────────────────────────────────────────

    - name: Post — background check
      if: env.VALID == 'true' && env.DUPLICATE == 'false'
      run: |
        sleep 4
        curl -s -X POST \
          -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
          -H "Accept: application/vnd.github+json" \
          -d "{\"body\":\"![](https://readme-typing-svg.demolab.com?font=Jersey+10&size=30&duration=3000&pause=99999&color=33793d&vCenter=true&repeat=false&width=500&height=40&lines=Running+background+check...)\n\n\`\`\`\nAZ-51 SECURE TERMINAL — DREAMLAND NETWORK\nEstablishing encrypted connection ... OK\nIdentity confirmed: ${{ github.actor }}\nChecking prior bookings ... NONE FOUND\nVerifying clearance level ...\nPinging Dreamland flight reservation system ...\nPod allocation in progress ...\n\`\`\`\"}" \
          "https://api.github.com/repos/${{ github.repository }}/issues/${{ github.event.issue.number }}/comments"

    - name: Generate intake data
      if: env.VALID == 'true' && env.DUPLICATE == 'false'
      run: |
        POD_NUM=$((RANDOM % 28 + 8))
        ROWS=("A" "B" "C" "D" "F")
        POD_ROW=${ROWS[$((RANDOM % 5))]}
        RAND=$(openssl rand -base64 12 | tr -dc 'A-Z0-9' | head -c 6)
        SPECIMEN="A51-$(date +%Y%m%d)-${RAND}"
        echo "POD=${POD_NUM}${POD_ROW}" >> $GITHUB_ENV
        echo "SPECIMEN=$SPECIMEN" >> $GITHUB_ENV
        echo "USER_DATE=$(date +%Y-%m-%d)" >> $GITHUB_ENV
        echo "USER_AVATAR=https://avatars.githubusercontent.com/${{ github.actor }}" >> $GITHUB_ENV

    - name: Add user to README
      if: env.VALID == 'true' && env.DUPLICATE == 'false'
      run: |
        git config --local user.name "github-actions"
        git config --local user.email "github-actions@github.com"

        NEW_ROW="| [${{ github.actor }}](https://github.com/${{ github.actor }}) | <img src=\"${{ env.USER_AVATAR }}\" width=\"30\" height=\"30\" /> | ${{ env.USER_DATE }} |"

        update_readme() {
          awk -v new_row="$NEW_ROW" '
          BEGIN {
            inside_users=0; inside_old=0
            header_users=0; header_old=0
            user_count=0; overflow=""
          }

          /<!--START_SECTION:users-->/ {
            print; inside_users=1
            if (!header_users) {
              print "| Name | Picture | Date |"
              print "| ---- | ---------------- | ---- |"
              header_users=1
            }
            print new_row; next
          }

          inside_users && /^\|.*\|.*\|.*\|$/ && !/\| Name \|/ && !/\| ---- \|/ {
            user_count++
            if (user_count <= 2) print
            else if (overflow == "") overflow=$0
            next
          }

          /<!--END_SECTION:users-->/ {
            print; inside_users=0; next
          }

          /<!--START_SECTION:old_users-->/ {
            print; inside_old=1
            print "| Name | Picture | Date |"
            print "| ---- | ---------------- | ---- |"
            if (overflow != "") print overflow
            next
          }

          inside_old && /^\|.*\|.*\|.*\|$/ && !/\| Name \|/ && !/\| ---- \|/ {
            print; next
          }

          /<!--END_SECTION:old_users-->/ {
            print; inside_old=0; next
          }

          !/\| Name \|/ && !/\| ---- \|/ { print }
          ' README.md > README.tmp && mv README.tmp README.md
        }

        for i in {1..3}; do
          git reset --hard; git clean -fd
          git fetch origin main; git reset --hard origin/main
          update_readme
          git add README.md
          git commit -m "Add ${{ github.actor }} to log"
          git push && exit 0
          sleep $((i * 2))
        done
        exit 1

    - name: Post — abduction notice
      if: env.VALID == 'true' && env.DUPLICATE == 'false'
      run: |
        curl -s -X POST \
          -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
          -H "Accept: application/vnd.github+json" \
          -d "{\"body\":\"![](https://readme-typing-svg.demolab.com?font=Jersey+10&size=30&duration=3000&pause=99999&color=33793d&vCenter=true&repeat=false&width=500&height=40&lines=Clearance+approved.+Issuing+intake+pass...)\n\n\`\`\`\nAZ-51 SECURE TERMINAL — DREAMLAND NETWORK\nBackground check .............. PASSED\nFlight reservation ............. CONFIRMED\nPod allocated ................. ${{ env.POD }}\nClearance level ................ STANDARD\n\`\`\`\n\n---\n\n\`\`\`\n╔══════════════════════════════════════════════╗\n║   🛸  MOTHERSHIP AIR  ·  FLIGHT AZ-51      ║\n╠══════════════════════════════════════════════╣\n║   ABDUCTEE  :  ${{ github.actor }}\n║   FROM       :  LOWW   Vienna Intl.          ║\n║   TO         :  KXTA   Groom Lake       ║\n║   POD       :  ${{ env.POD }}                              ║\n║   CLASS      :  STANDARD                     ║\n║   PILOT      :  Zorg the Unblinking               ║\n║   OPERATED   :  Dreamland Charter     ║\n║   SPECIMEN ID  :  ${{ env.SPECIMEN }}              ║\n╚══════════════════════════════════════════════╝\n\`\`\`\n\n🛸 You have been added to the log. Command has been notified.\n\n---\n\n### Got a promo code?\n\nIf you have an **exclusive access code**, drop it as a comment right here and you will be upgraded to **⭐ Probe Class** status with access to the Hangar 18. 🎉\n\nNo code? No worries — your booking is confirmed as-is.\n\n> _This issue closes in 2 minutes._\"}" \
          "https://api.github.com/repos/${{ github.repository }}/issues/${{ github.event.issue.number }}/comments"

    - name: Wait then close
      if: env.VALID == 'true' && env.DUPLICATE == 'false'
      run: |
        sleep 120
        curl -s -X PATCH \
          -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
          -H "Accept: application/vnd.github+json" \
          "https://api.github.com/repos/${{ github.repository }}/issues/${{ github.event.issue.number }}" \
          -d '{"state":"closed","state_reason":"completed"}'

  # ─────────────────────────────────────────────
  # JOB 2 — Someone comments a code (open or closed issue)
  # ─────────────────────────────────────────────
  check-promo-code:
    if: |
      github.event_name == 'issue_comment' &&
      github.event.comment.user.login != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: write

    steps:
    - name: Checkout
      uses: actions/checkout@v3

    - name: Check code
      run: |
        SECRET_CODE="AREA1947"
        COMMENT="${{ github.event.comment.body }}"
        if echo "$COMMENT" | grep -qi "$SECRET_CODE"; then
          echo "CODE_VALID=true" >> $GITHUB_ENV
        else
          echo "CODE_VALID=false" >> $GITHUB_ENV
        fi

    - name: Check log and VIP status
      if: env.CODE_VALID == 'true'
      run: |
        USER="${{ github.event.comment.user.login }}"
        if grep -q "\[${USER}\]" README.md; then
          echo "ON_LOG=true" >> $GITHUB_ENV
        else
          echo "ON_LOG=false" >> $GITHUB_ENV
        fi
        if grep -q "⭐ \[${USER}\]" README.md; then
          echo "ALREADY_VIP=true" >> $GITHUB_ENV
        else
          echo "ALREADY_VIP=false" >> $GITHUB_ENV
        fi

    - name: Reply — not on log
      if: env.CODE_VALID == 'true' && env.ON_LOG == 'false'
      run: |
        curl -s -X POST \
          -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
          -H "Accept: application/vnd.github+json" \
          -d '{"body":"## ⚠️ Code Accepted — But You Are Not on the Log\n\nPlease apply first by opening an issue titled exactly `Abduction`.\nOnce added, you can redeem your code at any time."}' \
          "https://api.github.com/repos/${{ github.repository }}/issues/${{ github.event.issue.number }}/comments"

    - name: Reply — already VIP
      if: env.CODE_VALID == 'true' && env.ON_LOG == 'true' && env.ALREADY_VIP == 'true'
      run: |
        curl -s -X POST \
          -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
          -H "Accept: application/vnd.github+json" \
          -d '{"body":"✨ You are already a **⭐ Probe Class**. See you aboard."}' \
          "https://api.github.com/repos/${{ github.repository }}/issues/${{ github.event.issue.number }}/comments"

    - name: Post — verifying code
      if: env.CODE_VALID == 'true' && env.ON_LOG == 'true' && env.ALREADY_VIP == 'false'
      run: |
        curl -s -X POST \
          -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
          -H "Accept: application/vnd.github+json" \
          -d "{\"body\":\"![](https://readme-typing-svg.demolab.com?font=Jersey+10&size=30&duration=3000&pause=99999&color=c0a000&vCenter=true&repeat=false&width=500&height=40&lines=Verifying+access+code...)\"}" \
          "https://api.github.com/repos/${{ github.repository }}/issues/${{ github.event.issue.number }}/comments"

    - name: Upgrade README to VIP
      if: env.CODE_VALID == 'true' && env.ON_LOG == 'true' && env.ALREADY_VIP == 'false'
      run: |
        git config --local user.name "github-actions"
        git config --local user.email "github-actions@github.com"
        USER="${{ github.event.comment.user.login }}"

        upgrade_readme() {
          sed -i "s/\[${USER}\]/⭐ [${USER}]/" README.md
        }

        for i in {1..3}; do
          git reset --hard; git clean -fd
          git fetch origin main; git reset --hard origin/main
          upgrade_readme
          git add README.md
          git commit -m "Upgrade ${USER} to VIP"
          git push && exit 0
          sleep $((i * 2))
        done
        exit 1

    - name: Post — VIP granted
      if: env.CODE_VALID == 'true' && env.ON_LOG == 'true' && env.ALREADY_VIP == 'false'
      run: |
        sleep 3
        VIP_SPECIMEN="A51-PROBE-$(openssl rand -base64 12 | tr -dc 'A-Z0-9' | head -c 6)"
        curl -s -X POST \
          -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
          -H "Accept: application/vnd.github+json" \
          -d "{\"body\":\"![](https://readme-typing-svg.demolab.com?font=Jersey+10&size=30&duration=4000&pause=99999&color=c0a000&vCenter=true&repeat=false&width=600&height=40&lines=VIP+Access+Granted.+Welcome+aboard.)\n\n\`\`\`\nAZ-51 SECURE TERMINAL — DREAMLAND NETWORK\nPromo code ..................... VERIFIED\nUpgrading abductee ${{ github.event.comment.user.login }} ...\nClearance level ................ ⭐ PROBE CLASS\nAccess ......................... Hangar 18 · Level B · Dry Lake Bed\nNew specimen ID .................. $VIP_SPECIMEN\n\`\`\`\n\n---\n\n🌟 You have been upgraded on the log. See you aboard.\"}" \
          "https://api.github.com/repos/${{ github.repository }}/issues/${{ github.event.issue.number }}/comments"
