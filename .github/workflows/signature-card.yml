name: Signature Card

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "signature/**"
      - ".github/workflows/signature-card.yml"

jobs:
  render:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout
      uses: actions/checkout@v5

    - name: Setup Node
      uses: actions/setup-node@v5
      with:
        node-version: 22

    - name: Render card
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        STATS_TOKEN: ${{ secrets.STATS_TOKEN || secrets.GH_TOKEN }}
      run: node signature/generate.mjs

    - name: Commit card
      run: |
        if git diff --quiet assets/signature.svg; then
          echo "Stats unchanged"
          exit 0
        fi

        git config --local user.name "github-actions"
        git config --local user.email "github-actions@github.com"
        cp assets/signature.svg /tmp/signature.svg
        # a new url per version, otherwise browsers and camo keep showing the old card
        VERSION=$(sha256sum /tmp/signature.svg | cut -c1-8)

        for i in {1..3}; do
          git fetch origin main; git reset --hard origin/main
          cp /tmp/signature.svg assets/signature.svg
          sed -i "s|assets/signature.svg?v=[0-9a-z]*|assets/signature.svg?v=${VERSION}|" README.md
          git add assets/signature.svg README.md
          git commit -m "Update signature card stats"
          git push && exit 0
          sleep $((i * 2))
        done
        exit 1
